
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#09090b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/svg+xml" href="./icon.svg">
    <link rel="apple-touch-icon" href="./icon.svg">
    <meta name="description" content="Calculadora minimalista y precisa con historial, funciones científicas y modo oscuro sin conexión.">
    <meta name="application-name" content="Calculadora Gratis">
    
    <title>Calculadora Gratis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                        mono: ['"Chivo Mono"', 'ui-monospace', 'monospace'],
                        brand: ['"Asap Condensed"', 'sans-serif-condensed', 'sans-serif']
                    },
                    colors: { brand: { light: '#3b82f6', dark: '#60a5fa' } },
                    animation: { 'slide-up': 'slideUp 0.3s ease-out' },
                    keyframes: { slideUp: { '0%': { transform: 'translateY(100%)' }, '100%': { transform: 'translateY(0)' } } }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Asap+Condensed:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Chivo+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@400;500;600&display=swap');
        
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        .font-mono { font-family: 'Chivo Mono', monospace; font-feature-settings: "tnum"; }
        .font-brand { font-family: 'Asap Condensed', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; outline: none !important; }
        html, body { margin: 0; padding: 0; background: #09090b; min-height: 100vh; overflow-x: hidden; }
        * { -webkit-user-select: none; user-select: none; }
        
        #loading-screen {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #09090b;
            color: white;
            z-index: 100;
            transition: opacity 0.4s ease;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner { width: 30px; height: 30px; border: 2px solid rgba(59, 130, 246, 0.1); border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 15px; }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
        "react/": "https://esm.sh/react@^19.2.4/",
        "react": "https://esm.sh/react@^19.2.4"
      }
    }
    </script>
<link rel="stylesheet" href="./index.css">
</head>
<body>
    <div id="loading-screen">
        <div style="text-align: center;">
            <div class="spinner"></div>
            <p style="font-family: 'Asap Condensed', sans-serif; font-size: 14px; letter-spacing: 2.5px; text-transform: uppercase; opacity: 0.4; font-weight: 600;">Calculadora</p>
        </div>
    </div>

    <div id="root"></div>

    <script type="module" src="./index.tsx"></script>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('SW registrado:', reg.scope))
                .catch(err => console.debug('SW skip:', err));
        }

        // Remover pantalla de carga al montar React
        window.addEventListener('load', () => {
            const loader = document.getElementById('loading-screen');
            if (loader) {
                setTimeout(() => {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.remove(), 400);
                }, 150);
            }
        });
    </script>
</body>
</html>
